name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew assembleDebug --stacktrace
      - run: cp app/build/outputs/apk/debug/app-debug.apk KuralKathaigal.apk
      - uses: actions/upload-artifact@v4
        with:
          name: KuralKathaigal-debug-apk
          path: KuralKathaigal.apk
      - name: Publish to the "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Kural Kathaigal (latest build)
          body: Debug APK built from ${{ github.sha }}. Install on Android (allow installs from unknown sources).
          prerelease: false
          make_latest: true
          files: KuralKathaigal.apk
